name: Android port

# The Android app (android/): the bridge under the host harness (ASan/UBSan), the unit tests (parsers on the
# recorded fixtures, themes, scum policy), and a release APK.  The APK is signed with the debug key unless a
# keystore.properties is provided, so it installs for testing but is not a store build.
on:
  push:
    branches: [ android ]
    paths: [ 'android/**', 'bridge/**', 'src/**', 'lib/**', 'ui/**', 'tools/**', '.github/workflows/android-port.yaml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-android-port
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Host harness (ASan/UBSan)
        run: ./host-test.sh

      - name: Unit tests and release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: NarSil-android.apk
          path: android/app/build/outputs/apk/release/app-release.apk
